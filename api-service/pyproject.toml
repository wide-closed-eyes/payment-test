[project]
name = "payment-service"
version = "0.1.0"
description = "Test case with payment service realization. REST + Outbox pattern. FastAPI, SQLAlchemy, RabbitMQ, pydantic v2."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.3,<3.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "faststream[rabbit] (>=0.7.7,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
flake8 = "^7.4.1"
pytest = ">=8.0.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.gitignore
  | \.flake8
  | \.venv
  | test
  | poetry\.lock
  | README\.md
  | pyproject\.toml
  | \.env
)/
'''

[tool.isort]
profile = "black"
include_trailing_comma = true
line_length = 88
skip = [".venv", "dev", "alembic", "__init__.py", "test"]